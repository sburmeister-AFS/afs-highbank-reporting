<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Highbank Program Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --cat-carpet: #2a78d6;
    --cat-hard: #eb6834;
    --cat-tile: #1baf7a;
    --good: #006300;
    --good-bg: #e6f4e6;
    --critical: #d03b3b;
    --critical-bg: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --cat-carpet: #3987e5;
      --cat-hard: #d95926;
      --cat-tile: #199e70;
      --good: #0ca30c;
      --good-bg: #123312;
      --critical: #e66767;
      --critical-bg: #3a1a1a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --cat-carpet: #3987e5;
    --cat-hard: #d95926;
    --cat-tile: #199e70;
    --good: #0ca30c;
    --good-bg: #123312;
    --critical: #e66767;
    --critical-bg: #3a1a1a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---- gate ---- */
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--page);
  }
  #gate .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 36px 32px; width: 320px; text-align: center;
  }
  #gate h1 { font-size: 18px; margin: 0 0 4px; }
  #gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
  #gate input {
    width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--gridline); background: var(--page); color: var(--text-primary);
    margin-bottom: 10px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; font-size: 14px; font-weight: 600;
    border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  #gate .err { color: var(--critical); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ---- app ---- */
  #app { display: none; }
  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.2px; }
  header.top .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  select, .btn {
    font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--gridline);
    background: var(--surface-1); color: var(--text-primary);
  }

  nav.tabs {
    display: flex; gap: 4px; border-bottom: 1px solid var(--gridline); margin-bottom: 20px;
    flex-wrap: wrap;
  }
  nav.tabs button {
    font-size: 13px; font-weight: 600; padding: 9px 14px; border: none; background: none;
    color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  nav.tabs button .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px;
  }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .kpi {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .kpi .value { font-size: 20px; font-weight: 700; margin-top: 4px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 11.5px; margin-top: 5px; font-weight: 600; color: var(--text-muted); }
  .kpi .delta.good { color: var(--good); }
  .kpi .delta.bad { color: var(--critical); }

  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); margin: 26px 0 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface-1); border-radius: 10px; overflow: hidden; }
  table.card { border: 1px solid var(--border); }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--gridline); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  td.status-good { color: var(--good); font-weight: 600; }
  td.status-bad { color: var(--critical); font-weight: 600; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
  }
  .status-pill.good { color: var(--good); background: var(--good-bg); }
  .status-pill.bad { color: var(--critical); background: var(--critical-bg); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }

  .stat-pair { display: flex; gap: 20px; margin-top: 4px; }
  .stat-pair .stat { flex: 1; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat-pair .stat .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .stat-pair .stat .value { font-size: 18px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }

  tr.cat-row { cursor: pointer; }
  tr.cat-row:hover td { background: var(--page); }
  tr.cat-row .chev { display: inline-block; width: 10px; font-size: 10px; color: var(--text-muted); }
  tr.cat-expand td { background: var(--page); padding: 10px 12px 14px 30px; }
  tr.cat-expand table { background: transparent; }
  tr.cat-expand th { padding: 5px 10px; }
  tr.cat-expand td.sub { padding: 5px 10px; border-bottom: 1px solid var(--gridline); }
  tr.cat-expand .sub-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  footer.foot { margin-top: 40px; font-size: 11px; color: var(--text-muted); }
  .imputed-note { font-size: 11.5px; color: var(--text-muted); margin: -10px 0 20px; }
  .imputed-note strong { color: var(--text-secondary); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>Highbank Program Dashboard</h1>
    <p>Enter the password to continue</p>
    <input id="gate-pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="gate-btn">Sign in</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Highbank Program Dashboard</h1>
        <div class="meta" id="refreshed-meta">Loading…</div>
      </div>
      <div class="controls">
        <select id="period-select"></select>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="overall" class="active">Overall</button>
      <button data-tab="Carpet"><span class="dot" style="background:var(--cat-carpet)"></span>Carpet</button>
      <button data-tab="Hard Surface"><span class="dot" style="background:var(--cat-hard)"></span>Hard Surface</button>
      <button data-tab="Tile"><span class="dot" style="background:var(--cat-tile)"></span>Tile</button>
      <button data-tab="leaderboard">Leaderboard</button>
    </nav>

    <div id="content"></div>

    <footer class="foot">Highbank-line basis (delivered sales, NORMAL service type). Bundled-invoice lines are imputed to whole-job margin — see the note under each period's KPIs for the exact share.</footer>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gjqcypgbpekddqzjekvh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqcWN5cGdicGVrZGRxempla3ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMzgxNTMsImV4cCI6MjA5NjcxNDE1M30.gFyfRs4Og0Bod1EmODIOvYolFfGo9QkGgOlTZtPR8Po';
const VIEWER_EMAIL = 'highbank-viewer@afsgroup.local';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS = ['Carpet', 'Hard Surface', 'Tile'];
const CAT_COLOR = { 'Carpet': 'var(--cat-carpet)', 'Hard Surface': 'var(--cat-hard)', 'Tile': 'var(--cat-tile)' };

const MARGIN_TARGETS = {
  'RETAIL':    { good: 0.45, bad: 0.40 },
  'WHOLESALE': { good: 0.30, bad: 0.25 },
  'BUILDER':   { good: 0.35, bad: 0.25 },
};

let ALL_ROWS = [];
let PERIODS = [];       // [{key, label, year, months:[1..n]}]
let selectedPeriod = null;
let activeTab = 'overall';
let expandedCategory = null;

// ---------------- formatting ----------------
const fmt$ = (n) => {
  if (n == null || !isFinite(n)) return '–';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n < 0 ? '-' : '') + '$' + (abs / 1000000).toFixed(2) + 'M';
  if (abs >= 1000) return (n < 0 ? '-' : '') + '$' + Math.round(abs).toLocaleString();
  return '$' + Math.round(n).toLocaleString();
};
const fmtNum = (n) => n == null ? '–' : Math.round(n).toLocaleString();
const fmtPct = (n) => n == null || !isFinite(n) ? '–' : (n * 100).toFixed(1) + '%';
const fmtDelta = (cur, prior) => {
  if (prior == null || prior === 0) return { text: cur > 0 ? '(new)' : '–', cls: '' };
  const d = (cur - prior) / Math.abs(prior) * 100;
  const cls = d > 1 ? 'good' : d < -1 ? 'bad' : '';
  return { text: (d >= 0 ? '+' : '') + d.toFixed(1) + '% YoY', cls };
};
const fmtPP = (cur, prior) => {
  if (prior == null) return { text: '(new)', cls: '' };
  const d = (cur - prior) * 100;
  const cls = d > 0.3 ? 'good' : d < -0.3 ? 'bad' : '';
  return { text: (d >= 0 ? '+' : '') + d.toFixed(1) + 'pp YoY', cls };
};

// ---------------- gate ----------------
async function trySignIn(password) {
  const { data, error } = await sb.auth.signInWithPassword({ email: VIEWER_EMAIL, password });
  return { ok: !error, error };
}

document.getElementById('gate-btn').addEventListener('click', doSignIn);
document.getElementById('gate-pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSignIn(); });

async function doSignIn() {
  const pw = document.getElementById('gate-pw').value;
  const errEl = document.getElementById('gate-err');
  errEl.textContent = '';
  if (!pw) return;
  const { ok } = await trySignIn(pw);
  if (!ok) { errEl.textContent = 'Incorrect password.'; return; }
  showApp();
}

async function checkExistingSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) { showApp(); }
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}

// ---------------- data load ----------------
async function loadData() {
  const { data: refreshRows } = await sb.from('hb_refresh_log').select('*').order('refreshed_at', { ascending: false }).limit(1);
  const refreshed = refreshRows && refreshRows[0];
  document.getElementById('refreshed-meta').textContent = refreshed
    ? `Last refreshed ${new Date(refreshed.refreshed_at).toLocaleString()} · ${refreshed.line_count.toLocaleString()} HB lines`
    : 'No refresh log yet';

  let rows = [];
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await sb.from('hb_lines').select('*').range(from, from + PAGE - 1);
    if (error) { console.error(error); break; }
    if (!data || data.length === 0) break;
    rows = rows.concat(data);
    if (data.length < PAGE) break;
  }
  ALL_ROWS = rows;

  buildPeriods();
  renderPeriodSelect();
  render();
}

function buildPeriods() {
  const years = [...new Set(ALL_ROWS.map(r => r.del_year))].sort((a, b) => b - a);
  if (years.length === 0) { PERIODS = []; return; }
  const maxYear = years[0];
  const maxMonth = Math.max(...ALL_ROWS.filter(r => r.del_year === maxYear).map(r => r.del_month));

  PERIODS = [];
  PERIODS.push({
    key: 'ytd', label: `${maxYear} YTD (thru month ${maxMonth})`,
    cur: { year: maxYear, months: range(1, maxMonth) },
    prior: { year: maxYear - 1, months: range(1, maxMonth) },
  });
  years.forEach(y => {
    PERIODS.push({
      key: 'fy' + y, label: `${y} Full Year`,
      cur: { year: y, months: range(1, 12) },
      prior: { year: y - 1, months: range(1, 12) },
    });
  });
  selectedPeriod = PERIODS[0];
}
function range(a, b) { const out = []; for (let i = a; i <= b; i++) out.push(i); return out; }

function renderPeriodSelect() {
  const sel = document.getElementById('period-select');
  sel.innerHTML = PERIODS.map(p => `<option value="${p.key}">${p.label}</option>`).join('');
  sel.addEventListener('change', () => {
    selectedPeriod = PERIODS.find(p => p.key === sel.value);
    render();
  });
}

function rowsFor(period, cat) {
  const f = (r) => r.del_year === period.year && period.months.includes(r.del_month) && (!cat || r.category === cat);
  return ALL_ROWS.filter(f);
}

function agg(rows) {
  const a = { rev: 0, cost: 0, profit: 0, qty: 0, lines: rows.length, invs: new Set() };
  rows.forEach(r => { a.rev += +r.revenue; a.cost += +r.cost; a.profit += +r.profit; a.qty += +r.qty; a.invs.add(r.invoice); });
  a.margin = a.rev > 0 ? a.profit / a.rev : null;
  a.invCount = a.invs.size;
  return a;
}

// ---------------- tabs ----------------
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  activeTab = btn.dataset.tab;
  expandedCategory = null;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

// ---------------- category drill-down (Overall tab) ----------------
document.getElementById('content').addEventListener('click', (e) => {
  const row = e.target.closest('tr.cat-row');
  if (!row) return;
  const cat = row.dataset.cat;
  expandedCategory = expandedCategory === cat ? null : cat;
  render();
});

function topStylesByCost(rows, n) {
  const m = new Map();
  rows.forEach(r => {
    if (!m.has(r.style)) m.set(r.style, { qty: 0, cost: 0, rev: 0, profit: 0 });
    const e = m.get(r.style);
    e.qty += +r.qty; e.cost += +r.cost; e.rev += +r.revenue; e.profit += +r.profit;
  });
  return [...m.entries()].sort((a, b) => b[1].cost - a[1].cost).slice(0, n);
}

function categoryExpandRow(cat, curRows) {
  const top5 = topStylesByCost(curRows.filter(r => r.category === cat), 5);
  const rowsHtml = top5.map(([style, e]) => `<tr>
    <td class="sub">${style}</td>
    <td class="sub num">${fmt$(e.cost)}</td>
    <td class="sub num">${fmtNum(e.qty)}</td>
    <td class="sub num">${fmt$(e.rev)}</td>
    <td class="sub num">${fmtPct(e.rev > 0 ? e.profit / e.rev : null)}</td>
  </tr>`).join('') || `<tr><td class="sub" colspan="5">No lines for ${cat} in this period.</td></tr>`;
  return `<tr class="cat-expand"><td colspan="6">
    <div class="sub-title">Top 5 ${cat} Products by COGS</div>
    <table>
      <thead><tr><th>Style</th><th class="num">COGS</th><th class="num">Qty</th><th class="num">Revenue</th><th class="num">Margin</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </td></tr>`;
}

// ---------------- render ----------------
function render() {
  if (!selectedPeriod) return;
  const content = document.getElementById('content');
  if (activeTab === 'overall') content.innerHTML = renderOverall();
  else if (activeTab === 'leaderboard') content.innerHTML = renderLeaderboard();
  else content.innerHTML = renderCategory(activeTab);
}

function imputedNote(rows) {
  if (rows.length === 0) return '';
  const imputedRows = rows.filter(r => r.is_imputed);
  if (imputedRows.length === 0) return `<div class="imputed-note">No imputed-revenue lines in this period — every figure is actual billed revenue/profit.</div>`;
  const totalRev = rows.reduce((s, r) => s + (+r.revenue), 0);
  const imputedRev = imputedRows.reduce((s, r) => s + (+r.revenue), 0);
  const lineShare = imputedRows.length / rows.length;
  const revShare = totalRev > 0 ? imputedRev / totalRev : 0;
  return `<div class="imputed-note">
    <strong>${fmtPct(lineShare)}</strong> of HB lines (<strong>${fmtPct(revShare)}</strong> of revenue) in this period are on bundled invoices —
    their revenue/margin is imputed from whole-job margin rather than actual billing. The rest is actual billed revenue.
  </div>`;
}

function kpiCard(label, valueText, delta) {
  return `<div class="kpi">
    <div class="label">${label}</div>
    <div class="value">${valueText}</div>
    ${delta ? `<div class="delta ${delta.cls}">${delta.text}</div>` : ''}
  </div>`;
}

function renderOverall() {
  const curRows = rowsFor(selectedPeriod.cur);
  const priorRows = rowsFor(selectedPeriod.prior);
  const cur = agg(curRows), prior = agg(priorRows);
  const hasPrior = priorRows.length > 0;

  const kpis = [
    kpiCard('HB Revenue', fmt$(cur.rev), hasPrior ? fmtDelta(cur.rev, prior.rev) : null),
    kpiCard('HB COGS', fmt$(cur.cost), hasPrior ? fmtDelta(cur.cost, prior.cost) : null),
    kpiCard('HB Profit', fmt$(cur.profit), hasPrior ? fmtDelta(cur.profit, prior.profit) : null),
    kpiCard('HB Margin', fmtPct(cur.margin), hasPrior ? fmtPP(cur.margin, prior.margin) : null),
    kpiCard('HB Lines', fmtNum(cur.lines), hasPrior ? fmtDelta(cur.lines, prior.lines) : null),
  ].join('');

  const catRows = CATS.map(cat => {
    const c = agg(curRows.filter(r => r.category === cat));
    const p = agg(priorRows.filter(r => r.category === cat));
    const d = hasPrior ? fmtDelta(c.rev, p.rev) : null;
    const isOpen = expandedCategory === cat;
    const row = `<tr class="cat-row" data-cat="${cat}">
      <td><span class="chev">${isOpen ? '▾' : '▸'}</span><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLOR[cat]};margin-right:7px;"></span>${cat}</td>
      <td class="num">${fmt$(c.rev)}</td>
      <td class="num">${fmt$(c.cost)}</td>
      <td class="num">${fmt$(c.profit)}</td>
      <td class="num">${fmtPct(c.margin)}</td>
      <td class="num">${d ? `<span class="${d.cls === 'good' ? 'status-good' : d.cls === 'bad' ? 'status-bad' : ''}">${d.text}</span>` : '–'}</td>
    </tr>`;
    return row + (isOpen ? categoryExpandRow(cat, curRows) : '');
  }).join('');

  const channelRows = channelMixRows(curRows, priorRows, hasPrior);

  return `
    <div class="kpi-row">${kpis}</div>
    ${imputedNote(curRows)}
    <div class="two-col">
      <div>
        <h2 class="section">Category Contribution</h2>
        <table class="card">
          <thead><tr><th>Category</th><th class="num">Revenue</th><th class="num">COGS</th><th class="num">Profit</th><th class="num">Margin</th><th class="num">YoY Rev</th></tr></thead>
          <tbody>${catRows}</tbody>
        </table>
      </div>
      <div>
        <h2 class="section">Channel Mix</h2>
        <table class="card">
          <thead><tr><th>Channel</th><th class="num">Revenue</th><th class="num">Margin</th><th class="num">Share</th></tr></thead>
          <tbody>${channelRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function channelMixRows(curRows, priorRows, hasPrior) {
  const byChan = new Map();
  curRows.forEach(r => {
    if (!byChan.has(r.channel)) byChan.set(r.channel, { rev: 0, cost: 0, profit: 0 });
    const e = byChan.get(r.channel);
    e.rev += +r.revenue; e.cost += +r.cost; e.profit += +r.profit;
  });
  const totalRev = [...byChan.values()].reduce((s, e) => s + e.rev, 0);
  const entries = [...byChan.entries()].sort((a, b) => b[1].rev - a[1].rev);

  return entries.map(([chan, e]) => {
    const margin = e.rev > 0 ? e.profit / e.rev : null;
    const target = MARGIN_TARGETS[chan];
    let statusHtml = fmtPct(margin);
    if (target && margin != null) {
      if (margin >= target.good) statusHtml = `<span class="status-pill good">▲ ${fmtPct(margin)}</span>`;
      else if (margin < target.bad) statusHtml = `<span class="status-pill bad">▼ ${fmtPct(margin)}</span>`;
    }
    const share = totalRev > 0 ? e.rev / totalRev : 0;
    return `<tr>
      <td>${titleCase(chan)}</td>
      <td class="num">${fmt$(e.rev)}</td>
      <td class="num">${statusHtml}</td>
      <td class="num">${fmtPct(share)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" class="empty">No data for this period.</td></tr>';
}

function titleCase(s) {
  return String(s || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function renderCategory(cat) {
  const curRows = rowsFor(selectedPeriod.cur, cat);
  const priorRows = rowsFor(selectedPeriod.prior, cat);
  const cur = agg(curRows), prior = agg(priorRows);
  const hasPrior = priorRows.length > 0;

  const kpis = [
    kpiCard('HB Revenue', fmt$(cur.rev), hasPrior ? fmtDelta(cur.rev, prior.rev) : null),
    kpiCard('HB COGS', fmt$(cur.cost), hasPrior ? fmtDelta(cur.cost, prior.cost) : null),
    kpiCard('HB Profit', fmt$(cur.profit), hasPrior ? fmtDelta(cur.profit, prior.profit) : null),
    kpiCard('HB Margin', fmtPct(cur.margin), hasPrior ? fmtPP(cur.margin, prior.margin) : null),
    kpiCard('Invoices', fmtNum(cur.invCount), hasPrior ? fmtDelta(cur.invCount, prior.invCount) : null),
  ].join('');

  const channelRows = channelMixRows(curRows, priorRows, hasPrior);

  // top styles
  const styleAgg = new Map();
  curRows.forEach(r => {
    if (!styleAgg.has(r.style)) styleAgg.set(r.style, { qty: 0, cost: 0, rev: 0, profit: 0 });
    const e = styleAgg.get(r.style);
    e.qty += +r.qty; e.cost += +r.cost; e.rev += +r.revenue; e.profit += +r.profit;
  });
  const priorStyleAgg = new Map();
  priorRows.forEach(r => {
    if (!priorStyleAgg.has(r.style)) priorStyleAgg.set(r.style, { rev: 0, profit: 0 });
    const e = priorStyleAgg.get(r.style);
    e.rev += +r.revenue; e.profit += +r.profit;
  });
  const topStyles = [...styleAgg.entries()].sort((a, b) => b[1].rev - a[1].rev).slice(0, 10);
  const styleRows = topStyles.map(([style, e]) => {
    const p = priorStyleAgg.get(style);
    const d = hasPrior ? fmtDelta(e.rev, p ? p.rev : null) : null;
    const margin = e.rev > 0 ? e.profit / e.rev : null;
    return `<tr>
      <td>${style}</td>
      <td class="num">${fmtNum(e.qty)}</td>
      <td class="num">${fmt$(e.cost)}</td>
      <td class="num">${fmt$(e.rev)}</td>
      <td class="num">${fmtPct(margin)}</td>
      <td class="num">${d ? `<span class="${d.cls === 'good' ? 'status-good' : d.cls === 'bad' ? 'status-bad' : ''}">${d.text}</span>` : '–'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">No data for this period.</td></tr>';

  // top suppliers
  const supAgg = new Map();
  curRows.forEach(r => {
    const sup = r.supplier || '(none)';
    if (!supAgg.has(sup)) supAgg.set(sup, { rev: 0, cost: 0, profit: 0 });
    const e = supAgg.get(sup);
    e.rev += +r.revenue; e.cost += +r.cost; e.profit += +r.profit;
  });
  const topSup = [...supAgg.entries()].sort((a, b) => b[1].rev - a[1].rev).slice(0, 8);
  const supRows = topSup.map(([sup, e]) => `<tr>
    <td>${sup}</td>
    <td class="num">${fmt$(e.rev)}</td>
    <td class="num">${fmtPct(e.rev > 0 ? e.profit / e.rev : null)}</td>
  </tr>`).join('') || '<tr><td colspan="3" class="empty">No data for this period.</td></tr>';

  // trailing COGS averages, from del_date, relative to latest date in the whole dataset
  const allDates = ALL_ROWS.filter(r => r.category === cat && r.del_date).map(r => new Date(r.del_date));
  const cogsAvgs = trailingCogsAverages(cat, allDates.length ? new Date(Math.max(...allDates)) : new Date());

  return `
    <div class="kpi-row">${kpis}</div>
    ${imputedNote(curRows)}
    <div class="two-col">
      <div>
        <h2 class="section">Top Styles</h2>
        <table class="card">
          <thead><tr><th>Style</th><th class="num">Qty</th><th class="num">COGS</th><th class="num">Revenue</th><th class="num">Margin</th><th class="num">YoY</th></tr></thead>
          <tbody>${styleRows}</tbody>
        </table>
      </div>
      <div>
        <h2 class="section">Channel Mix</h2>
        <table class="card">
          <thead><tr><th>Channel</th><th class="num">Revenue</th><th class="num">Margin</th><th class="num">Share</th></tr></thead>
          <tbody>${channelRows}</tbody>
        </table>
        <h2 class="section">Top Suppliers</h2>
        <table class="card">
          <thead><tr><th>Supplier</th><th class="num">Revenue</th><th class="num">Margin</th></tr></thead>
          <tbody>${supRows}</tbody>
        </table>
      </div>
    </div>
    <h2 class="section">Trailing COGS Average</h2>
    <div class="stat-pair">
      <div class="stat"><div class="label">4-Week Avg (weekly COGS)</div><div class="value">${fmt$(cogsAvgs.w4)}</div></div>
      <div class="stat"><div class="label">13-Week Avg (weekly COGS)</div><div class="value">${fmt$(cogsAvgs.w13)}</div></div>
    </div>
  `;
}

function trailingCogsAverages(cat, asOf) {
  const rows = ALL_ROWS.filter(r => r.category === cat && r.del_date);
  const cutoff4 = new Date(asOf); cutoff4.setDate(cutoff4.getDate() - 28);
  const cutoff13 = new Date(asOf); cutoff13.setDate(cutoff13.getDate() - 91);
  let cost4 = 0, cost13 = 0;
  rows.forEach(r => {
    const d = new Date(r.del_date);
    if (d > cutoff13 && d <= asOf) cost13 += +r.cost;
    if (d > cutoff4 && d <= asOf) cost4 += +r.cost;
  });
  return { w4: cost4 / 4, w13: cost13 / 13 };
}

function renderLeaderboard() {
  const curRows = rowsFor(selectedPeriod.cur);
  const priorRows = rowsFor(selectedPeriod.prior);
  const hasPrior = priorRows.length > 0;

  const styleAgg = new Map();
  curRows.forEach(r => {
    if (!styleAgg.has(r.style)) styleAgg.set(r.style, { rev: 0, cost: 0, profit: 0, cats: new Set(), invs: new Set() });
    const e = styleAgg.get(r.style);
    e.rev += +r.revenue; e.cost += +r.cost; e.profit += +r.profit; e.cats.add(r.category); e.invs.add(r.invoice);
  });
  const priorStyleAgg = new Map();
  priorRows.forEach(r => {
    if (!priorStyleAgg.has(r.style)) priorStyleAgg.set(r.style, { rev: 0, profit: 0 });
    const e = priorStyleAgg.get(r.style);
    e.rev += +r.revenue; e.profit += +r.profit;
  });

  const catAbbr = (cats) => [...cats].map(c => c === 'Carpet' ? 'Carp' : c === 'Hard Surface' ? 'HS' : 'Tile').join('/');

  const byRev = [...styleAgg.entries()].sort((a, b) => b[1].rev - a[1].rev).slice(0, 10);
  const revRows = byRev.map(([style, e]) => {
    const p = priorStyleAgg.get(style);
    const d = hasPrior ? fmtDelta(e.rev, p ? p.rev : null) : null;
    const margin = e.rev > 0 ? e.profit / e.rev : null;
    return `<tr>
      <td>${style}</td><td>${catAbbr(e.cats)}</td>
      <td class="num">${fmt$(e.rev)}</td><td class="num">${fmt$(e.cost)}</td>
      <td class="num">${fmtPct(margin)}</td><td class="num">${e.invs.size}</td>
      <td class="num">${d ? `<span class="${d.cls === 'good' ? 'status-good' : d.cls === 'bad' ? 'status-bad' : ''}">${d.text}</span>` : '–'}</td>
    </tr>`;
  }).join('');

  const REV_FLOOR = 40000;
  const byMargin = [...styleAgg.entries()]
    .filter(([, e]) => e.rev >= REV_FLOOR)
    .sort((a, b) => (b[1].rev > 0 ? b[1].profit / b[1].rev : -Infinity) - (a[1].rev > 0 ? a[1].profit / a[1].rev : -Infinity))
    .slice(0, 10);
  const marginRows = byMargin.map(([style, e]) => `<tr>
    <td>${style}</td><td>${catAbbr(e.cats)}</td>
    <td class="num">${fmtPct(e.rev > 0 ? e.profit / e.rev : null)}</td>
    <td class="num">${fmt$(e.rev)}</td><td class="num">${fmt$(e.cost)}</td><td class="num">${e.invs.size}</td>
  </tr>`).join('');

  return `
    <h2 class="section">Top 10 by HB Revenue</h2>
    <table class="card">
      <thead><tr><th>Style</th><th>Cat</th><th class="num">HB Rev</th><th class="num">HB COGS</th><th class="num">Margin</th><th class="num">Invs</th><th class="num">YoY</th></tr></thead>
      <tbody>${revRows || '<tr><td colspan="7" class="empty">No data.</td></tr>'}</tbody>
    </table>
    <h2 class="section">Top 10 by HB Margin (rev ≥ $40,000)</h2>
    <table class="card">
      <thead><tr><th>Style</th><th>Cat</th><th class="num">Margin</th><th class="num">HB Rev</th><th class="num">HB COGS</th><th class="num">Invs</th></tr></thead>
      <tbody>${marginRows || '<tr><td colspan="6" class="empty">No data.</td></tr>'}</tbody>
    </table>
  `;
}

checkExistingSession();
</script>
</body>
</html>
